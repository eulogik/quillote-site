<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Quillote social card</title>
<style>
  @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/instrument-serif-regular.woff2") format("woff2"); font-weight: 400; font-display: block; }
  @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/instrument-serif-italic.woff2") format("woff2"); font-style: italic; font-weight: 400; font-display: block; }
  @font-face { font-family: "Inter"; src: url("assets/fonts/inter-var.woff2") format("woff2"); font-weight: 300 700; font-display: block; }
  * { box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
  body {
    position: relative;
    background: #0b0d11;
    color: #f3eee3;
    font-family: "Inter", sans-serif;
  }
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 88% 30%, rgba(217,164,65,.16), transparent 36%),
      radial-gradient(circle at 12% 100%, rgba(217,164,65,.07), transparent 40%);
  }
  .rule { position: absolute; left: 0; top: 0; width: 100%; height: 5px; background: #d9a441; }
  .brand { position: absolute; left: 68px; top: 58px; display: flex; align-items: center; gap: 13px; }
  .brand img { width: 36px; height: 36px; }
  .brand span { font-family: "Instrument Serif", serif; font-size: 32px; letter-spacing: -.01em; }
  .copy { position: absolute; left: 68px; top: 160px; width: 580px; }
  .eyebrow { margin: 0 0 18px; font-family: ui-monospace, monospace; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: #d9a441; }
  h1 { margin: 0; font-family: "Instrument Serif", serif; font-weight: 400; font-size: 76px; line-height: .98; letter-spacing: -.025em; color: #f6f1e6; }
  h1 em { color: #f0c46a; font-weight: 400; }
  .sub { margin: 26px 0 0; width: 500px; color: #a9a291; font-size: 19px; line-height: 1.55; }
  .foot { position: absolute; left: 68px; bottom: 46px; display: flex; align-items: center; gap: 14px; font-family: ui-monospace, monospace; font-size: 12px; letter-spacing: .05em; color: #7d776a; }
  .foot b { color: #f0c46a; font-weight: 500; }
  .shot { position: absolute; right: 58px; top: 126px; width: 520px; border: 1px solid rgba(255,255,255,.14); border-radius: 14px; overflow: hidden; box-shadow: 0 40px 90px rgba(0,0,0,.55), 0 0 80px rgba(217,164,65,.07); background: #0d1016; }
  .shot img { display: block; width: 100%; height: auto; }
  .tag { position: absolute; right: 74px; top: 92px; font-family: ui-monospace, monospace; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #d9a441; }
</style>
</head>
<body>
  <div class="rule"></div>
  <div class="brand"><img src="assets/img/quillote-mark.svg" alt=""><span>Quillote</span></div>
  <div class="copy">
    <p class="eyebrow">Public beta · 0.1.3</p>
    <h1>Write Markdown.<br>Watch it <em>take shape</em>.</h1>
    <p class="sub">Live Markdown with a real code editor inside. 5.2 MB on Mac. 7.2 MB on Android. Your files stay on your disk.</p>
  </div>
  <div class="foot"><b>quillote.com</b><span>·</span><span>Source, Live, Read</span><span>·</span><span>No account</span></div>
  <span class="tag">Live mode</span>
  <div class="shot"><img src="assets/img/desktop-live-hero.png" alt=""></div>
</body>
</html>
